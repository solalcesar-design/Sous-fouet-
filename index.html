<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Fouet Dynamique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 30px; }
        select, button {
            padding: 15px 20px;
            font-size: 16px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            width: 80%;
            max-width: 300px;
        }
        select { background-color: #333; color: white; }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background-color: #218838; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>PWA Fouet Automatique 🤠</h1>

    <label for="soundSelect">Choisis ton son :</label>
    <select id="soundSelect">
        <option value="">Chargement de la bibliothèque...</option>
    </select>

    <button id="startBtn">Activer le Fouet</button>

    <div id="status">Connexion à GitHub...</div>

    <script>
        // CONFIGURATION DE TON GITHUB AUTOMATIQUE
        const GITHUB_USERNAME = "solalcesar-design"; 
        const GITHUB_REPO = "Sous-fouet-";   

        const startBtn = document.getElementById('startBtn');
        const soundSelect = document.getElementById('soundSelect');
        const statusDiv = document.getElementById('status');
        
        let audioContext = null;
        let audioBuffer = null;

        // Sensibilité de la secousse (plus le chiffre est bas, plus c'est sensible)
        const SHAKE_THRESHOLD = 70; 
        let lastX = 0, lastY = 0, lastZ = 0;
        let lastTime = 0;

        // 1. Récupérer automatiquement la liste des sons via l'API GitHub
        async function fetchAudioFiles() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Impossible de lister le dépôt");
                
                const files = await response.json();
                
                // Vide le menu de sélection
                soundSelect.innerHTML = "";

                // Filtre pour ne garder que le mp3 et le wav
                const audioFiles = files.filter(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    return ['mp3', 'wav'].includes(ext);
                });

                if (audioFiles.length === 0) {
                    soundSelect.innerHTML = '<option>Aucun son trouvé</option>';
                    statusDiv.textContent = "Ajoute des fichiers .mp3 ou .wav sur ton GitHub !";
                    return;
                }

                // Ajoute dynamiquement chaque fichier trouvé dans le menu déroulant
                audioFiles.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.download_url; // URL Raw directe fournie par GitHub
                    // Nettoie le nom du fichier pour l'affichage (ex: "fouet_laser.mp3" -> "fouet laser")
                    option.textContent = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
                    soundSelect.appendChild(option);
                });

                statusDiv.textContent = "Bibliothèque chargée. Clique sur Activer !";

            } catch (error) {
                statusDiv.textContent = "Erreur de connexion avec GitHub. Vérifie que le dépôt est bien Public.";
                console.error(error);
            }
        }

        // 2. Précharger le son sélectionné dans la mémoire (AudioBuffer) pour zéro latence
        async function loadSound(url) {
            if (!url) return;
            statusDiv.textContent = "Chargement du son...";
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                statusDiv.textContent = "Prêt ! Secoue ton téléphone !";
            } catch (error) {
                statusDiv.textContent = "Erreur pendant le chargement de ce son.";
                console.error(error);
            }
        }

        // Jouer le son de manière instantanée
        function playSound() {
            if (!audioContext || !audioBuffer) return;
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.start(0);
        }

        // Recharger le nouveau son quand on change d'option dans la liste
        soundSelect.addEventListener('change', () => {
            if (audioContext && soundSelect.value) {
                loadSound(soundSelect.value);
            }
        });

        // 3. Activer l'audio et demander les permissions de mouvement au clic
        startBtn.addEventListener('click', async () => {
            if (!soundSelect.value) {
                statusDiv.textContent = "Attends que les sons chargent.";
                return;
            }

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            await loadSound(soundSelect.value);

            // Gestion de la permission pour l'accéléromètre (Requis sur iOS/Safari)
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        startMotionDetection();
                    } else {
                        statusDiv.textContent = "Permission refusée.";
                    }
                } catch (error) {
                    statusDiv.textContent = "Erreur d'accès aux capteurs.";
                    console.error(error);
                }
            } else {
                // Android et navigateurs standards
                startMotionDetection();
            }
        });

        // 4. Écouter les mouvements brusques
        function startMotionDetection() {
            window.addEventListener('devicemotion', (event) => {
                let acc = event.accelerationIncludingGravity;
                if (!acc) acc = event.acceleration;
                if (!acc) return;

                let currentTime = Date.now();
                if ((currentTime - lastTime) > 100) {
                    let diffTime = currentTime - lastTime;
                    lastTime = currentTime;

                    // Calcul de la secousse globale sur les 3 axes (X, Y, Z)
                    let speed = Math.abs(acc.x + acc.y + acc.z - lastX - lastY - lastZ) / diffTime * 10000;

                    if (speed > SHAKE_THRESHOLD) {
                        playSound();
                    }

                    lastX = acc.x;
                    lastY = acc.y;
                    lastZ = acc.z;
                }
            });
            startBtn.style.display = 'none'; // Masque le bouton d'activation
        }

        // Lancer la détection automatique au démarrage de la page
        fetchAudioFiles();
    </script>
</body>
</html>
