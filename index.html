<html lang="fr">

    <title>PWA Fouet Dynamique</title>

            height: 100vh;
            box-sizing: border-box;
        }

            font-size: 16px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            width: 80%;

        select { background-color: #333; color: white; }

            background-color: #28a745;

            font-weight: bold;

            transition: background 0.2s;
