<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Fouet Local</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 20px; }
        select, button, .slider-container {
            padding: 15px 20px;
            font-size: 16px;
            margin: 10px;
            border-radius: 8px;
            border: none;
            width: 80%;
            max-width: 300px;
            box-sizing: border-box;
        }
        select { background-color: #333; color: white; }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background-color: #0056b3; }
        #startBtn { background-color: #28a745; }
        #startBtn:active { background-color: #218838; }
        
        /* Style de la zone de sensibilité */
        .slider-container {
            background-color: #1e1e1e;
            border: 1px solid #333;
            text-align: left;
        }
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .slider-container input {
            width: 100%;
            cursor: pointer;
        }
        
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>PWA Fouet Local 🤖</h1>

    <button id="folderBtn">📁 Sélectionner le dossier des sons</button>

    <label for="soundSelect" style="margin-top: 15px;">Choisis ton son :</label>
    <select id="soundSelect" disabled>
        <option value="">Sélectionne un dossier d'abord...</option>
    </select>

    <div class="slider-container">
        <label for="sensitivitySlider">Sensibilité du mouvement : <b id="sensValue">Normale</b></label>
        <input type="range" id="sensitivitySlider" min="30" max="180" value="100" step="5">
    </div>

    <button id="startBtn" style="display: none;">Activer le Fouet</button>

    <div id="status">Clique sur le bouton dossier pour commencer.</div>

    <script>
        const folderBtn = document.getElementById('folderBtn');
        const startBtn = document.getElementById('startBtn');
        const soundSelect = document.getElementById('soundSelect');
        const statusDiv = document.getElementById('status');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const sensValueDisplay = document.getElementById('sensValue');
        
        let audioContext = null;
        let audioBuffer = null;
        let localFiles = {}; 

        // Le seuil est désormais modifiable par le curseur
        let shakeThreshold = 100; 
        let isPlaying = false; 
        let lastX = 0, lastY = 0, lastZ = 0;

        // Écouter les changements du curseur pour mettre à jour la sensibilité
        sensitivitySlider.addEventListener('input', () => {
            shakeThreshold = parseInt(sensitivitySlider.value);
            
            // Affichage d'un texte simple pour aider l'utilisateur
            if (shakeThreshold < 60) {
                sensValueDisplay.textContent = "Très Sensible ⚡";
            } else if (shakeThreshold <= 110) {
                sensValueDisplay.textContent = "Normale 👍";
            } else if (shakeThreshold <= 150) {
                sensValueDisplay.textContent = "Ferme 💪";
            } else {
                sensValueDisplay.textContent = "Trés Forte 💥";
            }
        });

        // 1. Ouvrir le sélecteur de dossier Android
        folderBtn.addEventListener('click', async () => {
            if ('showDirectoryPicker' in window) {
                try {
                    const directoryHandle = await window.showDirectoryPicker();
                    soundSelect.innerHTML = "";
                    localFiles = {};

                    for await (const entry of directoryHandle.values()) {
                        if (entry.kind === 'file') {
                            const ext = entry.name.split('.').pop().toLowerCase();
                            if (['mp3', 'wav'].includes(ext)) {
                                const file = await entry.getFile();
                                localFiles[entry.name] = file;

                                const option = document.createElement('option');
                                option.value = entry.name;
                                option.textContent = entry.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
                                soundSelect.appendChild(option);
                            }
                        }
                    }

                    if (Object.keys(localFiles).length === 0) {
                        statusDiv.textContent = "Aucun fichier .mp3 ou .wav trouvé dans ce dossier.";
                        return;
                    }

                    soundSelect.disabled = false;
                    startBtn.style.display = 'inline-block';
                    folderBtn.style.display = 'none'; 
                    statusDiv.textContent = "Dossier chargé ! Ajuste ta sensibilité et clique sur Activer.";

                } catch (err) {
                    statusDiv.textContent = "Accès au dossier annulé ou refusé.";
                    console.error(err);
                }
            } else {
                alert("Désolé, ton navigateur Android ne prend pas en charge l'accès aux dossiers. Utilise Google Chrome.");
            }
        });

        // 2. Charger le fichier local en mémoire
        async function loadLocalSound(fileName) {
            const file = localFiles[fileName];
            if (!file) return;

            statusDiv.textContent = "Chargement du son...";
            try {
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                statusDiv.textContent = "Prêt ! Secoue ton téléphone !";
            } catch (error) {
                statusDiv.textContent = "Erreur de lecture du fichier audio.";
                console.error(error);
            }
        }

        // 3. Jouer le son
        function playSound() {
            if (isPlaying || !audioContext || !audioBuffer) return;
            isPlaying = true;
            
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.onended = () => { isPlaying = false; };
            source.start(0);
        }

        soundSelect.addEventListener('change', () => {
            if (audioContext && soundSelect.value) {
                loadLocalSound(soundSelect.value);
            }
        });

        // 4. Activer l'audio et les mouvements au clic
        startBtn.addEventListener('click', async () => {
            if (!soundSelect.value) return;

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            await loadLocalSound(soundSelect.value);
            startMotionDetection();
        });

        // 5. Détecter le mouvement du fouet
        function startMotionDetection() {
            window.addEventListener('devicemotion', (event) => {
                let acc = event.accelerationIncludingGravity;
                if (!acc) return;

                let totalAcc = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
                let diff = Math.abs(totalAcc - (Math.abs(lastX) + Math.abs(lastY) + Math.abs(lastZ)));

                // Utilisation du seuil dynamique réglé par le curseur
                if (diff > shakeThreshold && !isPlaying) {
                    playSound();
                }

                lastX = acc.x; lastY = acc.y; lastZ = acc.z;
            });
            startBtn.style.display = 'none';
        }
    </script>
</body>
</html>
